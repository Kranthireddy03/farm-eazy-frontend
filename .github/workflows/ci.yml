name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  api-regression:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API regression (against configured backend)
        env:
          VITE_API_URL: ${{ secrets.REGRESSION_API_URL }}
          VITE_API_ENCRYPTION_SECRET: ${{ secrets.REGRESSION_API_ENCRYPTION_SECRET }}
          VITE_API_ENCRYPTION_ENABLED: 'true'
          VITE_API_GATEWAY_ENABLED: 'true'
          VITE_API_GATEWAY_CLIENT: ${{ secrets.REGRESSION_API_GATEWAY_CLIENT }}
        run: |
          if [ -z "$VITE_API_URL" ] || [ -z "$VITE_API_ENCRYPTION_SECRET" ]; then
            echo "Skipping API regression — configure REGRESSION_API_URL and REGRESSION_API_ENCRYPTION_SECRET repository secrets to enable."
            exit 0
          fi
          node scripts/regression-api.mjs
