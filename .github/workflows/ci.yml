name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'cursor/**'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  api-regression:
    name: API regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API regression (against configured backend)
        env:
          VITE_API_URL: ${{ secrets.REGRESSION_API_URL }}
          VITE_API_ENCRYPTION_SECRET: ${{ secrets.REGRESSION_API_ENCRYPTION_SECRET }}
          VITE_API_ENCRYPTION_ENABLED: 'true'
          VITE_API_GATEWAY_ENABLED: 'true'
          VITE_API_GATEWAY_CLIENT: ${{ secrets.REGRESSION_API_GATEWAY_CLIENT }}
        run: |
          if [ -z "$VITE_API_URL" ] || [ -z "$VITE_API_ENCRYPTION_SECRET" ]; then
            echo "Skipping API regression â€” configure REGRESSION_API_URL and REGRESSION_API_ENCRYPTION_SECRET to enable."
            exit 0
          fi
          node scripts/regression-api.mjs

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
